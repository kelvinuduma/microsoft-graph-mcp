name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Install scripts are skipped: building and testing do not need the
      # native token-cache addons, and skipping them avoids running
      # third-party code during CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build and test
        run: npm test

      - name: Check for committed identifiers
        # Fails if a tenant GUID, a local user path or a token-like string slips into tracked files.
        run: |
          if git grep -nIE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|C:[\\/]Users[\\/]|eyJ[A-Za-z0-9_-]{20,}' -- . ':!package-lock.json' ':!.github/workflows/ci.yml' | grep -v '00000000-0000-0000-0000-000000000000'; then
            echo "::error::Possible tenant ID, local path or token committed (see above)."
            exit 1
          fi
