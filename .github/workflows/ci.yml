name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Install scripts are skipped: the TypeScript build does not need the
      # native token-cache addons, and skipping them avoids compiling or
      # downloading binaries during CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build
