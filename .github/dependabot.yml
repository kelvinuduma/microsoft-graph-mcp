version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Keep the Node typings on the major matching the oldest supported
      # runtime (Node 20, the lowest version in the CI matrix). Newer typings
      # could hide use of APIs that do not exist on Node 20. Minor and patch
      # updates still arrive; bump this deliberately when the floor moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
